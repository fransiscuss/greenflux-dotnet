name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      - run: dotnet test --no-build -c Release

      # Drives the real clients against a local HTTP server and asserts what goes
      # over the wire. Exits non-zero on any failed check.
      - name: Integration harness
        run: dotnet run --project samples/Greenflux.Sdk.IntegrationHarness -c Release

      # The serialized form of every model must match the committed baseline.
      - name: Serialization golden check
        run: |
          dotnet run --project eng/SerializationGolden -c Release -- eng/golden-check
          diff -r eng/golden eng/golden-check

      # Packaging used to be exercised for the first time during a release, so a
      # broken .nupkg was only discovered once the tag already existed.
      - name: Verify the package builds
        run: dotnet pack src/Greenflux.Sdk/Greenflux.Sdk.csproj --no-build -c Release -o artifacts/packages

      - name: List package contents
        run: |
          for package in artifacts/packages/*.nupkg; do
            echo "== $package"
            unzip -l "$package"
          done

      # `dotnet list package --vulnerable` reports findings on stdout and still
      # exits 0, so the log has to be inspected for the build to fail.
      - name: Audit dependencies for known vulnerabilities
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.log
          if grep -q "has the following vulnerable packages" audit.log; then
            echo "::error::Vulnerable NuGet packages found."
            exit 1
          fi
